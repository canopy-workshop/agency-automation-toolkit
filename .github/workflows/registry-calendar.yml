# SPDX-License-Identifier: MPL-2.0
name: Registry calendar

on:
  schedule:
    - cron: "17 12 * * 1"   # Mondays 12:17 UTC (08:17 Eastern during DST)
  workflow_dispatch:
  push:
    paths:
      - "registry/automations/**"

permissions:
  contents: read
  issues: write

jobs:
  calendar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Open issues for upcoming registry events
        run: python registry/scripts/registry_to_issues.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
